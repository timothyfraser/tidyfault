# Netlify build settings for the tidyfault website (DEP-01).
# The site lives in website/. Production branch is main; deploy previews and
# branch deploys are turned OFF in the Netlify UI (see website/README.md).
# Redirects live in website/public/_redirects (the SPA fallback is its last line).

[build]
  base    = "website"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
