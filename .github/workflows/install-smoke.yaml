# Proof of the README install lines on a clean runner, from GitHub as a user
# would. Weekly and on demand only: never on push or pull_request.
name: install-smoke

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  R:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: install_github (R)
    env:
      # Without it remotes falls back to a shared, rate-limited PAT and the
      # GitHub API call for DESCRIPTION fails (first run, 2026-10-05).
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # igraph (via tidygraph/ggraph) links GLPK on Linux; a clean Ubuntu has
      # no libglpk, and the binary igraph then fails to load (2026-10-05).
      # README's install section says the same to users.
      - name: System library igraph needs on Linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglpk40

      - name: Install from GitHub and run concentrate()
        run: |
          Rscript -e 'install.packages("remotes"); remotes::install_github("timothyfraser/tidyfault"); library(tidyfault); stopifnot(identical(concentrate(curate(fakenodes, fakeedges)), c("B*C","A*B*D")))'

  Python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: pip git+ (Python)
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from GitHub and run concentrate()
        run: |
          pip install "git+https://github.com/timothyfraser/tidyfault#subdirectory=python"
          python -c "import tidyfault as tf; r = tf.concentrate(tf.curate(tf.data.fakenodes, tf.data.fakeedges)); print(r); assert list(r) == ['B*C', 'A*B*D']"
