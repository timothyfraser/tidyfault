# pytest for the Python twin in python/. Path-filtered; cancels superseded runs.
name: python-tests

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yaml"
  pull_request:
    # Drafts run no CI (Actions minutes are scarce): the job's `if` skips them,
    # and ready_for_review triggers the first run when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  pytest:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: pytest (Python ${{ matrix.python-version }})

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install the package with test extras
        run: pip install "./python[test]"

      - name: Run pytest
        run: pytest python/tests -q
