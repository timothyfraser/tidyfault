# Builds tidyfault for WebAssembly and publishes it as a CRAN-like binary
# repository at https://timothyfraser.github.io/tidyfault/repo/ so the website's
# R tab can install it in the browser with webR. Only tidyfault is built here;
# its dependencies come from repo.r-wasm.org. One job, path-filtered and
# cancel-in-progress because Actions minutes are scarce.
name: webr-build

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "src/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/webr-build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  webr-repo:
    # Same guard as the other workflows: draft PRs run nothing (this workflow
    # has no pull_request trigger today; the guard keeps it so if one is added).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: build and publish the webR repository
    permissions:
      contents: write # push the repository to the gh-pages branch
    env:
      # rwasm resolves its GitHub-hosted package overrides through the GitHub
      # API; without a token it uses a shared, rate-limited PAT and resolution
      # fails (first run, 2026-10-05).
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Keep the build outputs out of the package tarball
        run: printf '%s\n' '^_webr_repo$' '^_webr_image$' '^_gh-pages$' >> .Rbuildignore

      # Same container and calls as r-wasm/actions build-rwasm@v2 (its code.R),
      # run directly for two reasons found on the first runs (2026-10-05):
      #  1. the action's `docker run` passes no environment, so GITHUB_PAT never
      #     reached rwasm and it fell back to a rate-limited shared PAT;
      #  2. rwasm then resolved its 16 GitHub-hosted overrides (shiny, rigraph,
      #     ...) and failed. tidyfault is built alone (its dependencies come from
      #     repo.r-wasm.org at runtime), so `remotes = NULL` skips that lookup.
      # Pinned to the same webR release the site loads (WEBR_BASE in
      # website/src/runtime/webr.js). Bump both together.
      - name: Build tidyfault for WebAssembly
        run: |
          cat > "$RUNNER_TEMP/build.R" <<'RSCRIPT'
          pak::pak("r-wasm/rwasm")
          rwasm::add_pkg("local::.", repo_dir = "_webr_repo", remotes = NULL)
          RSCRIPT
          # rwasm installs the native (host) dependencies before cross-compiling,
          # and those binaries need system libraries: igraph -> GLPK, libxml2;
          # stringi -> ICU; systemfonts -> fontconfig, freetype (pkgdepends
          # sysreqs for ubuntu-24.04). pak's own sysreqs step ran a hidden
          # `apt-get update` that failed (third run; the fourth showed why,
          # below), so install them here, as root and with visible output,
          # and switch pak's step off.
          docker run --rm --user root -e GITHUB_PAT -e PKG_SYSREQS=false \
            -v "$PWD":/github/workspace -v "$RUNNER_TEMP/build.R":/build.R \
            --workdir /github/workspace \
            ghcr.io/r-wasm/webr:v0.6.0 bash -c '
              set -e
              # The image lists the rig apt repo with a signing key it lacks,
              # so any apt-get update exits 100 (fourth run). Nothing needed
              # here comes from it; drop that source only.
              grep -rl "rig.r-pkg.org" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r rm -f
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libglpk40 libxml2 libicu74 libfontconfig1 libfreetype6
              Rscript /build.R'

      - name: Check the repository holds a tidyfault binary
        run: |
          grep -q '^Package: tidyfault$' _webr_repo/src/contrib/PACKAGES
          ls _webr_repo/bin/emscripten/contrib/*/tidyfault_*.tgz
          ls _webr_repo/bin/emscripten/contrib/*/PACKAGES

      # Replace only /repo/ on gh-pages; everything else on the branch is kept.
      - name: Publish to gh-pages under /repo/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add --detach _gh-pages FETCH_HEAD
          else
            git worktree add --detach _gh-pages
            git -C _gh-pages checkout --orphan gh-pages
            git -C _gh-pages rm -rf --quiet .
          fi
          rm -rf _gh-pages/repo
          mkdir -p _gh-pages/repo
          cp -R _webr_repo/. _gh-pages/repo/
          touch _gh-pages/.nojekyll   # serve files as-is, no Jekyll build
          git -C _gh-pages add -A repo .nojekyll
          if git -C _gh-pages diff --cached --quiet; then
            echo "repo/ unchanged; nothing to publish"
            exit 0
          fi
          git -C _gh-pages commit --quiet -m "webR repository: tidyfault at ${GITHUB_SHA::7}"
          git -C _gh-pages push origin HEAD:refs/heads/gh-pages
